<svg viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Background Circle -->
  <circle cx="50" cy="50" r="48" fill="#040b1c" />
  <circle cx="50" cy="50" r="50" fill="url(#bgGrad)" opacity="0.3" />
  
  <!-- Glow Effect -->
  <path d="M 24 38 L 38 74 L 50 48 L 60 74 L 84 34" stroke="#00A3FF" stroke-width="14" fill="none" stroke-linecap="round" stroke-linejoin="round" opacity="0.25" filter="blur(6px)" />

  <!-- Main Logo Path -->
  <path d="M 24 38 L 38 74 L 50 48 L 60 74 L 84 34" stroke="url(#blueGrad)" stroke-width="10" fill="none" stroke-linecap="round" stroke-linejoin="round" />

  <!-- Fold details -->
  <path d="M 24 38 L 38 74 L 50 48 L 60 74 L 84 34" stroke="url(#blueGradLight)" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round" opacity="0.8" />

  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="100" y2="100">
      <stop stopColor="#0033aa"/>
      <stop offset="1" stopColor="#000000" stopOpacity="0"/>
    </linearGradient>
    <linearGradient id="blueGrad" x1="20" y1="20" x2="90" y2="80" gradientUnits="userSpaceOnUse">
      <stop stopColor="#0055ff"/>
      <stop offset="0.5" stopColor="#00aaff"/>
      <stop offset="1" stopColor="#00d2ff"/>
    </linearGradient>
    <linearGradient id="blueGradLight" x1="20" y1="20" x2="90" y2="80" gradientUnits="userSpaceOnUse">
      <stop stopColor="#66aaff"/>
      <stop offset="1" stopColor="#b3e5ff"/>
    </linearGradient>
  </defs>
</svg>
