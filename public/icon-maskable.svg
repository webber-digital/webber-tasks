<svg viewBox="0 0 120 120" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Maskable background (Solid) -->
  <rect width="120" height="120" fill="#080B14" />
  
  <!-- Glow Effect -->
  <path d="M 30 40 L 46 90 L 60 45 L 74 90 L 90 40" stroke="#00E5FF" stroke-width="14" fill="none" stroke-linecap="round" stroke-linejoin="round" opacity="0.6" filter="blur(6px)" />
  
  <!-- Outer Stroke -->
  <path d="M 30 40 L 46 90 L 60 45 L 74 90 L 90 40" stroke="#00B8D9" stroke-width="12" fill="none" stroke-linecap="round" stroke-linejoin="round" />

  <!-- Inner Stroke (Neon) -->
  <path d="M 30 40 L 46 90 L 60 45 L 74 90 L 90 40" stroke="#B3FCFF" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round" />
</svg>
