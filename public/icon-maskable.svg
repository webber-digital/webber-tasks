<svg viewBox="0 0 120 120" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Maskable background (Solid) -->
  <rect width="120" height="120" fill="#040b1c" />
  <rect width="120" height="120" fill="url(#bgGrad)" opacity="0.3" />
  
  <!-- Glow Effect -->
  <path d="M 32 50 L 46 84 L 60 56 L 74 84 L 88 46" stroke="#00A3FF" stroke-width="14" fill="none" stroke-linecap="round" stroke-linejoin="round" opacity="0.4" filter="blur(5px)" />

  <!-- Main Logo Path -->
  <path d="M 32 50 L 46 84 L 60 56 L 74 84 L 88 46" stroke="url(#blueGrad)" stroke-width="10" fill="none" stroke-linecap="round" stroke-linejoin="round" />

  <!-- Fold details -->
  <path d="M 32 50 L 46 84 L 60 56 L 74 84 L 88 46" stroke="url(#blueGradLight)" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round" opacity="0.9" />

  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="120" y2="120">
      <stop stopColor="#001144"/>
      <stop offset="1" stopColor="#000000" stopOpacity="0.8"/>
    </linearGradient>
    <linearGradient id="blueGrad" x1="30" y1="30" x2="100" y2="90" gradientUnits="userSpaceOnUse">
      <stop stopColor="#0055ff"/>
      <stop offset="0.5" stopColor="#00aaff"/>
      <stop offset="1" stopColor="#00d2ff"/>
    </linearGradient>
    <linearGradient id="blueGradLight" x1="30" y1="30" x2="100" y2="90" gradientUnits="userSpaceOnUse">
      <stop stopColor="#66aaff"/>
      <stop offset="1" stopColor="#b3e5ff"/>
    </linearGradient>
  </defs>
</svg>
